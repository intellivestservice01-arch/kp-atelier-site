<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KP Atelier</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="nav-root"></div>

<section class="section" style="padding-top:40px;">
  <div class="container">
    <div id="product-content">
      <div class="spinner"></div>
    </div>
  </div>
</section>

<section class="section" id="related-section" style="display:none;">
  <div class="container">
    <div class="section-head">
      <div><span class="eyebrow">You Might Also Like</span><h2>Related Pieces</h2></div>
    </div>
    <div class="product-grid" id="related-grid"></div>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="container">
    <div class="section-head">
      <div><span class="eyebrow">Reviews</span><h2>What Customers Say</h2></div>
      <button class="btn btn-glass" id="open-review-modal-btn">Leave a Review</button>
    </div>
    <div id="reviews-summary"></div>
    <div class="reviews-grid" id="reviews-grid">
      <div class="spinner"></div>
    </div>
  </div>
</section>

<div id="footer-root"></div>

<!-- Review submission modal (scoped to this product) -->
<div class="site-modal-overlay hidden" id="review-modal">
  <div class="site-modal glass">
    <button class="site-modal-close" id="close-review-modal">&times;</button>
    <span class="eyebrow">Share Your Experience</span>
    <h3>Leave a Review</h3>
    <form id="review-form">
      <div class="site-field">
        <label>Your name</label>
        <input type="text" id="review-name" required />
      </div>
      <div class="site-field">
        <label>Rating</label>
        <div class="star-input" id="star-input">
          <span data-value="1">&#9733;</span><span data-value="2">&#9733;</span><span data-value="3">&#9733;</span><span data-value="4">&#9733;</span><span data-value="5">&#9733;</span>
        </div>
        <input type="hidden" id="review-rating" value="5" />
      </div>
      <div class="site-field">
        <label>Your review</label>
        <textarea id="review-body" required placeholder="Tell us what you thought..."></textarea>
      </div>
      <button type="submit" class="btn btn-gold btn-block" id="submit-review-btn">Submit Review</button>
      <p class="site-field-hint">Reviews are checked before they go live, so it may take a moment to appear.</p>
    </form>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="js/api.js"></script>
<script src="js/product-card.js"></script>
<script src="js/site-layout.js"></script>
<script src="js/cart-drawer.js"></script>
<script src="js/chat-widget.js"></script>
<script src="js/video-embed.js"></script>
<script src="js/reviews.js"></script>
<script src="js/product.js"></script>
</body>
</html>
